<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nkamlot Math Challenge</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="game-container">
        <h2>👑 Nkamlot Math Quiz 👑 </h2>
        <div class="score" id="score">Score : 0</div>

        <!-- Question 1 -->
        <div id="q1" class="question">
            <p>1. Combien font 5 + 3 ?</p>
            <input type="radio" name="q1" value="6"> 6<br>
            <input type="radio" name="q1" value="9"> 9<br>
            <input type="radio" name="q1" value="8" class="correct"> 8<br>
            <button class="btn" onclick="verifier(1)">Valider</button>
        </div>

        <!-- Question 2 -->
        <div id="q2" class="question hidden">
            <p>2. Combien font 12 × 2 ?</p>
            <input type="radio" name="q2" value="22"> 22<br>
            <input type="radio" name="q2" value="24" class="correct"> 24<br>
            <input type="radio" name="q2" value="26"> 26<br>
            <button class="btn" onclick="verifier(2)">Valider</button>
        </div>

        <!-- Question 3 -->
        <div id="q3" class="question hidden">
            <p>3. Quelle est la racine carrée de 144 ?</p>
            <input type="radio" name="q3" value="10"> 10<br>
            <input type="radio" name="q3" value="12" class="correct"> 12<br>
            <input type="radio" name="q3" value="14"> 14<br>
            <button class="btn" onclick="verifier(3)">Valider</button>
        </div>

        <div id="q4" class="question hidden">
            <p>4. Combien font 48+(28*4) ?</p>
            <input type="radio" name="q3" value="109"> 109<br>
            <input type="radio" name="q3" value="78" class="correct"> 78<br>
            <input type="radio" name="q3" value="160"> 160<br>
            <button class="btn" onclick="verifier(4)">Valider</button>
        </div>

        <div id="q5" class="question hidden">
            <p>5. Combien font (92/2)+10 ? ?</p>
            <input type="radio" name="q3" value="46"> 46<br>
            <input type="radio" name="q3" value="56" class="correct"> 56<br>
            <input type="radio" name="q3" value="60"> 60<br>
            <button class="btn" onclick="verifier(5)">Valider</button>
        </div>

        <p id="resultat" class="hidden">🎉 Félicitations, tu as terminé le quiz !</p>
    </div>

    <script src="./app.js"></script>

</body>
</html>
